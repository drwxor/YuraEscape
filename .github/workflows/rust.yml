name: Rust

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            binary: target/release/YuraEscape

          - os: windows-latest
            name: windows-x86_64
            binary: target/release/YuraEscape.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: YuraEscape-${{ matrix.name }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v5
        with:
          name: YuraEscape-linux-x86_64
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: YuraEscape-windows-x86_64
          path: release/windows

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            release/linux/YuraEscape \
            release/windows/YuraEscape.exe \
            --generate-notes \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
